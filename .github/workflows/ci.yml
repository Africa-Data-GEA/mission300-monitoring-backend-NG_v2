name: CI

on:
  pull_request:
  push:
    # staging is deliberately NOT listed here: deploy.yml already triggers
    # on push to staging and calls this workflow itself as its "Test" job -
    # adding staging here too would run every test suite twice per push.
    branches: [main]
  workflow_call: {} # allows deploy.yml to use this as a reusable test gate

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: m300
          POSTGRES_PASSWORD: m300
          POSTGRES_DB: m300_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U m300"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      rabbitmq:
        image: rabbitmq:4-alpine
        env:
          RABBITMQ_DEFAULT_USER: m300
          RABBITMQ_DEFAULT_PASS: m300
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://m300:m300@localhost:5432/m300_test?schema=public
      RABBITMQ_URL: amqp://m300:m300@localhost:5672
      JWT_SECRET: ci-test-secret-not-a-real-secret-do-not-reuse

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        # Must run before lint/typecheck: @prisma/client is an empty stub
        # until this runs, so anything that imports it fails to typecheck
        # on a fresh checkout (this bit us - worked locally only because a
        # prior local run had already generated the client on disk).
        run: pnpm prisma:generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Prisma migrate (test DB)
        run: pnpm prisma:migrate:deploy

      - name: Seed test DB
        # test/*.e2e-spec.ts log in as the seeded admin/provider/reviewer
        # accounts and rely on the seed institutions - migrate alone leaves
        # an empty database, so every login 401s. Passed locally only because
        # the dev DB had already been seeded.
        run: pnpm exec ts-node prisma/seed-e2e.ts

      - name: Unit tests
        run: pnpm test

      - name: E2E tests
        run: pnpm test:e2e

      - name: Build
        run: pnpm build

      - name: Docker build (test only, not pushed)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: m300-backend:ci
